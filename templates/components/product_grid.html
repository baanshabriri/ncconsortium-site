<section class="mb-28">

    <h3 class="text-4xl font-extrabold text-yellow-500 mb-12">
        {{ section.title }}
    </h3>

    <div class="grid md:grid-cols-2 gap-x-20 gap-y-16">

        {% for item in section.items.all %}
        <div class="flex gap-6 items-start group">

            {% if item.image %}
            <img src="{{ item.image.url }}" alt="{{ item.name }}"
                class="w-32 h-32 rounded-full object-cover flex-shrink-0">
            {% else %}
            <div class="w-32 h-32 rounded-full bg-gray-300 flex-shrink-0"></div>
            {% endif %}

            <div class="max-w-[48ch] flex-1 min-w-0">
                <h4 class="font-bold text-sm uppercase tracking-wide mb-2">
                    {{ item.name }}
                </h4>
                <p
                    class="text-sm leading-[1.6] text-gray-700 overflow-hidden transition-all duration-300 ease-in-out line-clamp-5 md:group-hover:line-clamp-none cursor-pointer">
                    {{ item.description }}
                </p>
            </div>

        </div>
        {% endfor %}

    </div>

</section>

<style>
    .line-clamp-1 {
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
    }

    @media (min-width: 768px) {

        .md\:group-hover\:line-clamp-none:hover,
        .group:hover .md\:group-hover\:line-clamp-none {
            display: block;
            -webkit-line-clamp: unset;
        }
    }
</style>
