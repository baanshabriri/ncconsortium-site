<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}NC Consortium{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body class="bg-white text-gray-800">

  <!-- NAVBAR -->
  <nav class="bg-white md:shadow-sm border-b md:border-0 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto
       px-4 sm:px-6 md:px-8
       py-2 md:py-4
       flex items-center justify-between">

      <!-- Brand -->
      <a href="#hero" class="text-orange-500 font-serif tracking-widest
       text-base md:text-lg nav-link leading-none">
        NC
        <span class="block text-[9px] md:text-[10px]
         text-gray-600 tracking-normal mt-0.5">
          CONSORTIUM
        </span>
      </a>

      <!-- Desktop Menu -->
      <div class="hidden md:flex gap-6 text-sm font-semibold">
        <a href="#hero" class="nav-link hover:text-orange-500">Home</a>
        <a href="#company" class="nav-link hover:text-orange-500">Company</a>
        <a href="#mission" class="nav-link hover:text-orange-500">Mission</a>
        <a href="#products" class="nav-link hover:text-orange-500">Products</a>
        <a href="#other-products" class="nav-link hover:text-orange-500">Other Products</a>
        <a href="#contact" class="nav-link hover:text-orange-500">Contact</a>
      </div>

      <!-- Mobile Toggle -->
      <button id="menu-btn" class="md:hidden text-lg leading-none p-1" aria-label="Toggle Menu">
        ☰
      </button>
    </div>

    <!-- Mobile Menu -->
    <!-- Mobile Menu -->
    <div id="mobile-menu" class="md:hidden bg-white border-t
            overflow-hidden
            transition-all duration-300 ease-out
            max-h-0 opacity-0">
      <div class="px-4 py-3 flex flex-col gap-3 text-sm font-semibold">
        <a href="#hero" class="nav-link">Home</a>
        <a href="#company" class="nav-link">Company</a>
        <a href="#mission" class="nav-link">Mission</a>
        <a href="#products" class="nav-link">Products</a>
        <a href="#other-products" class="nav-link">Other Products</a>
        <a href="#contact" class="nav-link">Contact</a>
      </div>
    </div>

  </nav>



  <!-- MAIN CONTENT -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  {% include "components/footer.html" %}

  <!-- Mobile Menu Script -->
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const navLinks = document.querySelectorAll('.nav-link');

    let menuOpen = false;

    menuBtn.addEventListener('click', () => {
      menuOpen = !menuOpen;

      if (menuOpen) {
        mobileMenu.classList.remove('max-h-0', 'opacity-0');
        mobileMenu.classList.add('max-h-[500px]', 'opacity-100');
      } else {
        mobileMenu.classList.add('max-h-0', 'opacity-0');
        mobileMenu.classList.remove('max-h-[500px]', 'opacity-100');
      }
    });

    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth < 768 && menuOpen) {
          mobileMenu.classList.add('max-h-0', 'opacity-0');
          mobileMenu.classList.remove('max-h-[500px]', 'opacity-100');
          menuOpen = false;
        }
      });
    });
  </script>
  <script>
    const reveals = document.querySelectorAll('.reveal');

    const observer = new IntersectionObserver(
      entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('opacity-100', 'translate-y-0');
          }
        });
      },
      { threshold: 0.15 }
    );

    reveals.forEach(el => {
      el.classList.add(
        'opacity-0',
        'translate-y-8',
        'transition-all',
        'duration-700',
        'ease-out'
      );
      observer.observe(el);
    });
  </script>

</body>

</html>
