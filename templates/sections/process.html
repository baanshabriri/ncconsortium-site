<section class="py-8 md:py-16 bg-[#f4f4f4]">
    <div class="max-w-7xl mx-auto px-4 md:px-8">
        {% if process and process.url %}
        <div class="w-full overflow-hidden">
            <img src="{{ process.url }}" alt="Our Process" class="w-full h-auto object-contain">
        </div>
        {% else %}
        <div class="w-full aspect-video bg-gray-300 flex items-center justify-center text-xs md:text-sm text-gray-600">
            Image from PDF
        </div>
        {% endif %}
    </div>
</section>
