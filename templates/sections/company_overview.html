<section class="py-12 md:py-16 bg-[#f4f4f4]">
    <div class="max-w-7xl mx-auto px-4 md:px-8 grid md:grid-cols-2 gap-6 md:gap-8 items-center">

        <div class="bg-white p-6 md:p-10 shadow-md border-l-4 md:border-l-8 border-yellow-400">
            <h2
                class="inline-block bg-orange-500 text-white px-3 py-1.5 md:px-4 md:py-2 font-bold text-sm md:text-base mb-4 md:mb-6">
                {{ company.heading }}
            </h2>

            <p class="text-xs md:text-sm leading-[1.7] max-w-[48ch] text-gray-700 whitespace-pre-line">
                {{ company.body }}
            </p>
        </div>

        {% if company.image %}
        <div class="h-64 md:h-80 bg-gray-300 overflow-hidden flex items-center justify-center">
            <img src="{{ company.image.url }}" alt="{{ item.name }}" class="w-full h-full object-cover">
        </div>
        {% else %}
        <div class="h-64 md:h-80 bg-gray-300 flex items-center justify-center text-xs md:text-sm text-gray-600">
            Image from PDF
        </div>
        {% endif %}

    </div>
</section>
