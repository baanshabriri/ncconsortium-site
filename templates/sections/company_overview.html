<section class="py-24 bg-[#f4f4f4]">
    <div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-16 items-center">

        <div class="bg-white p-10 shadow-md border-l-8 border-yellow-400">
            <h2 class="inline-block bg-orange-500 text-white px-4 py-2 font-bold mb-6">
                {{ company.heading }}
            </h2>

            <p class="text-sm leading-[1.7] max-w-[48ch] text-gray-700 whitespace-pre-line">
                {{ company.body }}
            </p>
        </div>

        <div class="h-80 bg-gray-300 flex items-center justify-center text-sm text-gray-600">
            Image from PDF
        </div>

    </div>
</section>
